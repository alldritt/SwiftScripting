name: ScriptableTextEditor
options:
  bundleIdPrefix: com.latenightsw
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

localPackages:
  - ../..

targets:
  ScriptableTextEditor:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj"
    settings:
      SWIFT_VERSION: "6.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.latenightsw.ScriptableTextEditor
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: SwiftScripting
        product: SwiftScripting
      - package: SwiftScripting
        product: SwiftScriptingAppleEvents
